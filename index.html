box-shadow:0 4px 7px #000;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}.card.face{background:#fff;color:#151515}.card.red{color:#d71937}.folded{opacity:.45}.showdownPanel{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);z-index:14;display:none;width:min(92%,580px);max-height:180px;overflow:auto;padding:10px;border:2px solid #f4bb28;border-radius:18px;background:rgba(4,8,8,.95);box-shadow:0 0 25px rgba(255,184,32,.3)}.showdownPanel.active{display:block}.sdTitle{text-align:center;color:#ffd34d;font-weight:900;margin-bottom:6px}.sdRow{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}.sdName{width:74px;font-weight:900}.sdCard{width:30px;height:42px;border-radius:5px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.sdCard.red{color:#d71937}
.actions{position:absolute;z-index:30;left:10px;right:10px;bottom:58px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:9px;border:2px solid #e7a91e;border-radius:22px;background:linear-gradient(180deg,#0d0a12,#050507);box-shadow:0 -8px 30px rgba(0,0,0,.65)}.act{min-height:68px;border-radius:15px;border:2px solid #68717d;color:#fff;font-weight:900;font-size:14px;box-shadow:inset 0 1px rgba(255,255,255,.2),0 5px 12px #000}.pack{background:linear-gradient(#18202b,#070b10)}.side{background:linear-gradient(#07599a,#07386a);border-color:#159cff}.chaal{background:linear-gradient(#ffcb31,#c77600);border-color:#ffe47a;color:#180e00}.double{background:linear-gradient(#8c20d6,#4e0d89);border-color:#db8fff}.show{background:linear-gradient(#0ca654,#045b31);border-color:#51e99a}.act:disabled{filter:grayscale(.7);opacity:.48}.act:not(:disabled):active{transform:scale(.97)}.bottomInfo{position:absolute;left:12px;right:12px;bottom:8px;z-index:25;display:flex;justify-content:space-between;align-items:center}.pill{padding:7px 15px;border:1px solid #e7a91e;border-radius:20px;background:#09070c;color:#ffd34d;font-weight:900}.chat,.profile{position:absolute;bottom:170px;z-index:31;width:55px;height:55px;border-radius:50%;border:2px solid #e7a91e;background:#09070c;color:#fff;font-size:23px}.chat{left:18px}.profile{right:18px}.toast{position:absolute;left:50%;bottom:205px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.82);padding:9px 16px;border-radius:20px;font-weight:900;display:none}.modal{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:20px}.modal.show{display:flex}.modalBox{width:min(92%,390px);padding:22px;border:2px solid #e7a91e;border-radius:24px;background:linear-gradient(180deg,#25102f,#09070c);box-shadow:0 0 35px #000}.modalBox h2{color:#ffd34d;text-align:center}.input{width:100%;padding:13px;border-radius:12px;border:1px solid #9c7620;background:#050509;color:#fff;margin:8px 0}.modalBtn{width:100%;padding:13px;border-radius:14px;background:#d89b13;color:#111;font-weight:900;margin-top:8px}.status{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:40;font-size:11px;color:#bbb}

</style></head><body><main class="app"><div class="room"></div><div class="status" id="status">Connecting…</div><header class="topbar"><div class="logo">♛ Teen Patti Gold<small>ONLINE TABLE</small></div><div class="playersBadge" id="count">PLAYERS 0/4</div><div class="topicons"><button class="iconBtn" id="sound">🔊</button><button class="iconBtn" id="settings">⚙️</button></div></header><section class="dealer"><img class="dealerImg" src="dealer.png" alt="Dealer"><div class="dealerName">DEALER</div><div class="dealerDeck"><i class="miniCard"></i><i class="miniCard"></i><i class="miniCard"></i><b class="deckCount" id="deckCount">52</b></div></section><section class="table"><div class="ornament">♣</div><div class="pot"><div class="chips"><i class="chip r"></i><i class="chip b"></i><i class="chip g"></i><i class="chip r"></i></div><div class="potLabel" id="pot">POT 0</div><div class="yourTurn" id="turn">Waiting for players</div></div><div id="seats"></div><div class="showdownPanel" id="showdown"></div></section><button class="chat" id="chat">💬</button><button class="profile" id="profile">👥</button><nav class="actions"><button class="act pack" data-a="pack">♠<br>PACK</button><button class="act side" data-a="sideshow">◉<br>SIDE SHOW</button><button class="act chaal" data-a="chaal">🪙<br>CHAAL</button><button class="act double" data-a="double">2X<br>CHAAL</button><button class="act show" data-a="show">🃏<br>SHOW</button></nav><div class="bottomInfo"><div class="pill" id="balance">Balance 0</div><div class="pill" id="round">Round 0</div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalBox"><h2 id="modalTitle">JOIN TABLE</h2><input class="input" id="name" maxlength="18" placeholder="Your name"><button class="modalBtn" id="join">JOIN</button><button class="modalBtn" id="closeModal">CLOSE</button></div></div></main><script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];let ws=null,me=null,state=null,soundOn=true,audioCtx=null;const params=new URLSearchParams(location.search);let playerName=params.get('name')||'';
function tone(freq,dur=.09,type='sine',gain=.04){if(!soundOn)return;audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}
function actionSound(a){if(a==='pack')tone(180,.12,'square');else if(a==='show')tone(880,.2,'triangle',.06);else if(a==='double')tone(660,.12,'sawtooth');else tone(520,.08)}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
function connect(name){playerName=name||playerName||'Player';const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/?name=${encodeURIComponent(playerName)}`);ws.onopen=()=>{$('#status').textContent='ONLINE';tone(740,.1)};ws.onclose=()=>{$('#status').textContent='DISCONNECTED';setTimeout(()=>connect(playerName),1500)};ws.onerror=()=>{};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){me=m.id;return}if(m.type==='error'){toast(m.message);tone(130,.16);return}if(m.type==='state'){state=m.state;render();}}}
function send(a){if(!ws||ws.readyState!==1)return toast('Connecting…');actionSound(a);ws.send(JSON.stringify({type:'action',action:a}))}
function cardHTML(c){if(!c)return '';const red=c.suit==='♥'||c.suit==='♦';return `<div class="card face ${red?'red':''}">${c.rank}${c.suit}</div>`}
function render(){const ps=state.players;$('#count').textContent=`PLAYERS ${ps.length}/4`;$(`#pot`).textContent=`POT ${state.pot}`;$('#deckCount').textContent=state.deckCount;$('#round').textContent=`Round ${state.round}`;const meP=ps.find(p=>p.id===me);$('#balance').textContent=`Balance ${meP?meP.balance:0}`;const turnP=ps.find(p=>p.id===state.turn);$('#turn').textContent=state.phase==='playing'?(turnP&&turnP.id===me?`Your Turn`:`${turnP?.name||'Player'}'s Turn`):(state.message||'Waiting for players');
 const slots=[null,null,null,null];ps.forEach(p=>{const seat=p.seat%4;slots[seat]=p});const seatClasses=['left','right','bl','br'];const icons=['♠','♥','♦','♣'];$('#seats').innerHTML=slots.map((p,i)=>p?`<div class="seat ${seatClasses[i]} ${p.id===me?'me':''} ${p.folded?'folded':''}"><div class="avatar">${icons[i]}</div><div class="info"><div class="nm">${escapeHTML(p.name)}</div><div class="bal">${p.balance.toLocaleString()}</div></div><div class="cards">${p.cards.length?p.cards.map(cardHTML).join(''):Array.from({length:3},()=>'<div class="card"></div>').join('')}</div></div>`:'').join('');
 const buttons=$$('.act');buttons.forEach(b=>b.disabled=!(state.phase==='playing'&&state.turn===me&&!meP?.folded));
 if(state.showdown){$('#showdown').classList.add('active');$('#showdown').innerHTML='<div class="sdTitle">SHOWDOWN • ALL CARDS</div>'+ps.map(p=>`<div class="sdRow"><span class="sdName">${escapeHTML(p.name)}</span>${p.cards.map(cardHTML).join('')}</div>`).join('');}else $('#showdown').classList.remove('active');
 if(state.winnerIds?.includes(me))tone(980,.3,'triangle',.07);
}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$$('.act').forEach(b=>b.onclick=()=>send(b.dataset.a));$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(740,.08)};$('#settings').onclick=()=>toast('Settings ready');$('#chat').onclick=()=>toast('Chat ready');$('#profile').onclick=()=>{const p=state?.players?.find(x=>x.id===me);$('#modalTitle').textContent='PROFILE';$('#name').value=p?.name||playerName;$('#modal').classList.add('show')};$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#join').onclick=()=>{const n=$('#name').value.trim()||'Player';if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:'profile',name:n}));playerName=n;$('#modal').classList.remove('show');}};
window.addEventListener('pointerdown',()=>{if(soundOn){audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}},{once:true});
if(playerName)connect(playerName);else $('#modal').classList.add('show');
$('#join').addEventListener('click',()=>{if(!ws)connect($('#name').value.trim()||'Player')});
</script></body></html>
